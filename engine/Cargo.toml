[package]
name = "uaps-engine"
version = "0.1.1"
edition = "2021"
description = "U-APS Scheduling Engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
u-metaheur = { version = "0.3", path = "../../../algorithms/u-metaheur", features = ["serde"] }
u-schedule = { version = "0.5", path = "../../../frameworks/u-schedule" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
rand = "0.9"
rayon = "1.10"

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"

[[bench]]
name = "scheduler_benchmark"
harness = false
