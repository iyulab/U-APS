name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes) to avoid
# burning Actions minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must track the SDK's TargetFramework (sdk/Directory.Build.props: net10.0).
  # A 9.0.x SDK cannot target net10.0 — the build only passed because the runner
  # image happens to ship .NET 10 as well, which is luck, not configuration.
  DOTNET_VERSION: '10.0.x'

jobs:
  # `check` was removed: `clippy` (compiles + lints) and `test` (compiles +
  # runs) both already cover compilation, so a standalone `cargo check` only
  # duplicated work on every run.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: engine

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms ../../frameworks
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-schedule.git ../../frameworks/u-schedule
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: engine

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runners bill at 2x on private repos; test Windows only
        # post-merge on main, PRs run ubuntu only.
        os: ${{ github.ref == 'refs/heads/main' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms ../../frameworks
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-schedule.git ../../frameworks/u-schedule
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-targets
        working-directory: engine

  bench:
    name: Benchmark Build
    runs-on: ubuntu-latest
    # Bench build is a compile-only regression guard; run it post-merge on main
    # rather than on every PR to save Actions minutes.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms ../../frameworks
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-schedule.git ../../frameworks/u-schedule
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo bench --no-run
        working-directory: engine

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms ../../frameworks
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-schedule.git ../../frameworks/u-schedule
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps
        working-directory: engine
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms ../../frameworks
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-schedule.git ../../frameworks/u-schedule
      # Prebuilt binary (~seconds) instead of `cargo install cargo-audit`
      # which recompiles from source (~3-4 min) on every run.
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: engine

  sdk-build:
    name: SDK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Audit gate: NuGet's security audit already runs on every restore, but its
      # findings are warnings by default. AuditPipeline=true promotes NU1900-NU1905
      # to errors so a newly published advisory fails CI instead of scrolling past.
      - name: Restore (NuGet security audit gate)
        run: dotnet restore -p:AuditPipeline=true -p:EnableWindowsTargeting=true
        working-directory: sdk
      - run: dotnet build -c Release -p:EnableWindowsTargeting=true --no-restore
        working-directory: sdk

  changelog:
    name: Changelog Entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changelog has an entry for UAPSVersion
        run: bash scripts/check-changelog-entry.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms ../../frameworks
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-schedule.git ../../frameworks/u-schedule
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo llvm-cov --lcov --output-path lcov.info
        working-directory: engine
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: engine/lcov.info
          fail_ci_if_error: false
